name: Validate and publish game release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - downloads/**
      - docs/build_versions.json
      - docs/releases/**
      - docs/verification/**
      - tools/package_release.py
      - tools/publish_release.py
      - tests/release_tests.py
      - .github/workflows/release.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate release packaging and publication rules
        run: python3 -m unittest discover -s tests -p release_tests.py -v
      - name: Check canonical generated combat data
        run: |
          python3 tools/generate_config.py
          git diff --exit-code -- include/pkmn_character_defs.h include/pkmn_cpu_defs.h
      - name: Run host combat regressions
        run: |
          for suite in combat movement feel depth cpu; do
            g++ -std=c++17 -O2 -Iinclude src/pkmn_combat_core.cpp "tests/${suite}_tests.cpp" -o "/tmp/pkmn-${suite}-tests"
            "/tmp/pkmn-${suite}-tests"
          done
      - name: Verify tested ROM and prepare release assets
        run: python3 tools/package_release.py

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare the exact validated assets
        run: python3 tools/package_release.py
      - name: Upload, verify and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/publish_release.py > /tmp/pkmn-release-result.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('/tmp/pkmn-release-result.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Published game release: [' + result['tag'] + '](' + result['url'] + ')\n')
          print(result['url'])
          PY
